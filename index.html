<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戰術大賽對局數據分析系統</title>
    <!-- 引入 SheetJS 解析 CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f4f6f9; color: #333; }
        h1 { color: #1a5fb4; text-align: center; }
        .control-panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #1a5fb4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #154e96; }
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 0.9em; }
        th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #ddd; border-right: 1px solid #eee; }
        th { background-color: #f1f3f5; cursor: pointer; user-select: none; font-weight: bold; position: sticky; top: 0; }
        th:hover { background-color: #e2e6ea; }
        th::after { content: ' ⇅'; font-size: 0.8em; color: #888; }
        tr:hover { background-color: #f8f9fa; }
        
        /* 區分攻擊與防禦欄位色彩 */
        .atk-header { background-color: #e8f0fe !important; color: #1a73e8; }
        .def-header { background-color: #fce8e6 !important; color: #c5221f; }
        .stat-header { background-color: #e6f4ea !important; color: #137333; }
        
        .sp-cell { font-size: 0.85em; color: #555; background-color: #f9f9f9; }
        .win-rate { font-weight: bold; color: #d93025; font-size: 1em; }
    </style>
</head>
<body>

    <h1>🏆 戰術大賽對局合流與勝率分析</h1>

    <div class="control-panel">
        <label for="sheetUrl"><b>Google 試算表 CSV 連結：</b></label><br><br>
        <input type="text" id="sheetUrl" placeholder="請貼上發布為 CSV 的 Google 試算表網址...">
        <button onclick="fetchAndProcessData()">載入並合流數據</button>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th class="atk-header" onclick="sortTable(0)">APos1</th>
                    <th class="atk-header" onclick="sortTable(1)">APos2</th>
                    <th class="atk-header" onclick="sortTable(2)">APos3</th>
                    <th class="atk-header" onclick="sortTable(3)">APos4</th>
                    <th class="atk-header" onclick="sortTable(4)">ASP 組合 (無視順序)</th>
                    
                    <th class="def-header" onclick="sortTable(5)">DPos1</th>
                    <th class="def-header" onclick="sortTable(6)">DPos2</th>
                    <th class="def-header" onclick="sortTable(7)">DPos3</th>
                    <th class="def-header" onclick="sortTable(8)">DPos4</th>
                    <th class="def-header" onclick="sortTable(9)">DSP 組合 (無視順序)</th>
                    
                    <th class="stat-header" onclick="sortTable(10)">總場次</th>
                    <th class="stat-header" onclick="sortTable(11)">進攻勝場</th>
                    <th class="stat-header" onclick="sortTable(12)">進攻勝率 (%)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="13">請在上方輸入 CSV 連結並點擊載入...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let currentData = [];
        let sortAscending = false;

        // 1. 抓取 CSV 資料
        async function fetchAndProcessData() {
            const url = document.getElementById('sheetUrl').value.trim();
            if (!url) { alert('請輸入有效的 CSV 連結！'); return; }

            try {
                const response = await fetch(url);
                const data = await response.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);

                processAndAggregateData(rawRows);
            } catch (error) {
                alert('讀取失敗！請確認連結是否已發布為 CSV。\n錯誤詳情: ' + error);
            }
        }

        // 2. 核心合流演算法
        function processAndAggregateData(rows) {
            const aggregatedMap = new Map();

            rows.forEach(row => {
                // --- 攻擊隊資料處理 ---
                const apos1 = row['APos1'] || '-';
                const apos2 = row['APos2'] || '-';
                const apos3 = row['APos3'] || '-';
                const apos4 = row['APos4'] || '-';
                const asp1 = row['ASP1'] || '-';
                const asp2 = row['ASP2'] || '-';
                const sortedASP = [asp1, asp2].sort().join(' + ');

                // --- 防禦隊資料處理 ---
                const dpos1 = row['DPos1'] || '-';
                const dpos2 = row['DPos2'] || '-';
                const dpos3 = row['DPos3'] || '-';
                const dpos4 = row['DPos4'] || '-';
                const dsp1 = row['DSP1'] || '-';
                const dsp2 = row['DSP2'] || '-';
                const sortedDSP = [dsp1, dsp2].sort().join(' + ');

                // --- 數據統計處理 ---
                // 若 excel 有填寫「總場次」與「進攻勝場」，優先採用；否則預設每列算 1 場
                const gamesCount = Number(row['總場次']) || 1;
                const winsCount = Number(row['進攻勝場']) !== undefined ? Number(row['進攻勝場']) : 0;

                // 生成獨一無二的對局 Key (攻擊隊 Key vs 防禦隊 Key)
                const atkKey = `A:[${apos1},${apos2},${apos3},${apos4}]_ASP:[${sortedASP}]`;
                const defKey = `D:[${dpos1},${dpos2},${dpos3},${dpos4}]_DSP:[${sortedDSP}]`;
                const matchupKey = `${atkKey} VS ${defKey}`;

                if (!aggregatedMap.has(matchupKey)) {
                    aggregatedMap.set(matchupKey, {
                        apos1, apos2, apos3, apos4, asp: sortedASP,
                        dpos1, dpos2, dpos3, dpos4, dsp: sortedDSP,
                        totalGames: 0,
                        wins: 0
                    });
                }

                // 合流累加
                const matchupData = aggregatedMap.get(matchupKey);
                matchupData.totalGames += gamesCount;
                matchupData.wins += winsCount;
            });

            // 計算勝率並整理成列表
            currentData = Array.from(aggregatedMap.values()).map(item => {
                const winRate = item.totalGames > 0 
                    ? ((item.wins / item.totalGames) * 100).toFixed(1) 
                    : "0.0";
                return { ...item, winRate: parseFloat(winRate) };
            });

            renderTable(currentData);
        }

        // 3. 渲染表格
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.apos1}</b></td>
                    <td><b>${item.apos2}</b></td>
                    <td><b>${item.apos3}</b></td>
                    <td><b>${item.apos4}</b></td>
                    <td class="sp-cell">${item.asp}</td>
                    
                    <td><b>${item.dpos1}</b></td>
                    <td><b>${item.dpos2}</b></td>
                    <td><b>${item.dpos3}</b></td>
                    <td><b>${item.dpos4}</b></td>
                    <td class="sp-cell">${item.dsp}</td>
                    
                    <td>${item.totalGames}</td>
                    <td>${item.wins}</td>
                    <td class="win-rate">${item.winRate}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. 點擊欄位排序功能
        function sortTable(columnIndex) {
            const keys = [
                'apos1', 'apos2', 'apos3', 'apos4', 'asp',
                'dpos1', 'dpos2', 'dpos3', 'dpos4', 'dsp',
                'totalGames', 'wins', 'winRate'
            ];
            const key = keys[columnIndex];

            sortAscending = !sortAscending;

            currentData.sort((a, b) => {
                let valA = a[key];
                let valB = b[key];

                if (typeof valA === 'string') {
                    return sortAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return sortAscending ? valA - valB : valB - valA;
                }
            });

            renderTable(currentData);
        }
    </script>
</body>
</html>
