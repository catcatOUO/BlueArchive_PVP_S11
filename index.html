<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戰術大賽對局數據分析系統</title>
    <!-- 引入 SheetJS 解析 CSV -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 20px; background: #f4f6f9; color: #333; margin: 0; }
        h1 { color: #1a5fb4; text-align: center; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .status-bar { background: white; padding: 12px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .status-info { font-size: 0.9em; color: #555; }
        .refresh-btn { padding: 8px 16px; background: #1a5fb4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9em; transition: background 0.2s; }
        .refresh-btn:hover { background: #154e96; }
        .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 0.9em; }
        th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #eef2f5; border-right: 1px solid #f0f4f8; }
        th { background-color: #f8f9fa; cursor: pointer; user-select: none; font-weight: bold; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #dee2e6; }
        th:hover { background-color: #e9ecef; }
        th::after { content: ' ⇅'; font-size: 0.8em; color: #aaa; }
        tr:hover { background-color: #f1f5f9; }
        
        /* 區分攻擊與防禦欄位色彩 */
        .atk-header { background-color: #e8f0fe !important; color: #1a73e8; }
        .def-header { background-color: #fce8e6 !important; color: #c5221f; }
        .stat-header { background-color: #e6f4ea !important; color: #137333; }
        
        .sp-cell { font-size: 0.85em; color: #444; background-color: #fafafa; font-weight: 500; }
        .win-rate { font-weight: bold; color: #d93025; font-size: 1.05em; }
        .loading-text { font-size: 1.1em; color: #666; padding: 40px 0; }
    </style>
</head>
<body>

    <h1>🏆 戰術大賽對局合流與勝率分析</h1>
    <div class="subtitle">自動抓取內嵌雲端試算表 ➔ 對局資料合流 ➔ 動態勝率計算</div>

    <div class="status-bar">
        <div class="status-info">
            <b>資料來源：</b><span id="sourceStatus">連線中...</span> | 
            <b>最後更新：</b><span id="lastUpdated">-</span> | 
            <b>合流後對局總數：</b><span id="matchupCount">0</span>
        </div>
        <button class="refresh-btn" onclick="fetchAndProcessData(true)">🔄 手動重新整理</button>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th class="atk-header" onclick="sortTable(0)">APos1</th>
                    <th class="atk-header" onclick="sortTable(1)">APos2</th>
                    <th class="atk-header" onclick="sortTable(2)">APos3</th>
                    <th class="atk-header" onclick="sortTable(3)">APos4</th>
                    <th class="atk-header" onclick="sortTable(4)">ASP 組合 (無視順序)</th>
                    
                    <th class="def-header" onclick="sortTable(5)">DPos1</th>
                    <th class="def-header" onclick="sortTable(6)">DPos2</th>
                    <th class="def-header" onclick="sortTable(7)">DPos3</th>
                    <th class="def-header" onclick="sortTable(8)">DPos4</th>
                    <th class="def-header" onclick="sortTable(9)">DSP 組合 (無視順序)</th>
                    
                    <th class="stat-header" onclick="sortTable(10)">總場次</th>
                    <th class="stat-header" onclick="sortTable(11)">進攻勝場</th>
                    <th class="stat-header" onclick="sortTable(12)">進攻勝率 (%)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="13" class="loading-text">⏳ 正在連線至雲端試算表並進行數據合流，請稍候...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // =========================================================
        // 🔒 內嵌 Google 試算表 CSV 發布網址
        // 請將下方字串替換為您從「發布到網路」取得的 CSV 網址
        // =========================================================
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/17NTvWXCLHyS2Ay6iJWzyFhYfSa0ugDKe9kgTaHzkx4s/export?format=csv";

        let currentData = [];
        let sortAscending = false;

        // 頁面開啟時自動執行讀取
        window.addEventListener('DOMContentLoaded', () => {
            fetchAndProcessData();
        });

        // 1. 自動讀取內嵌的 CSV 資料 (加入 Cache-Buster 確保每次皆抓取最新資料)
        async function fetchAndProcessData(isManual = false) {
            const tbody = document.getElementById('tableBody');
            const statusElem = document.getElementById('sourceStatus');
            
            if (isManual) {
                tbody.innerHTML = '<tr><td colspan="13" class="loading-text">🔄 正在重新拉取最新雲端數據...</td></tr>';
            }

            if (!GOOGLE_SHEET_CSV_URL || GOOGLE_SHEET_CSV_URL.includes("YOUR_SPREADSHEET_ID_HERE")) {
                tbody.innerHTML = '<tr><td colspan="13" style="color:red; padding:30px;">⚠️ 請先在 index.html 程式碼內的 <b>GOOGLE_SHEET_CSV_URL</b> 填入您的 Google 試算表 CSV 網址！</td></tr>';
                statusElem.textContent = "未設定 CSV 網址";
                return;
            }

            try {
                // 加上時間戳記網址參數 (t=TIMESTAMP)，強制繞過瀏覽器與 CDN 快取，確保拿到最新雲端試算表資料
                const fetchUrl = GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                
                const response = await fetch(fetchUrl, { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP 錯誤! 狀態碼: ${response.status}`);
                
                const data = await response.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const rawRows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);

                processAndAggregateData(rawRows);

                // 更新狀態欄資訊
                statusElem.textContent = "已連線至雲端試算表";
                statusElem.style.color = "#137333";
                document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="13" style="color:red; padding:30px;">❌ 讀取失敗！請確認試算表已發布為 CSV，且網址正確。<br>詳細錯誤: ${error.message}</td></tr>`;
                statusElem.textContent = "連線失敗";
                statusElem.style.color = "#d93025";
            }
        }

        // 2. 核心：隊伍與對局合流演算法
        function processAndAggregateData(rows) {
            const aggregatedMap = new Map();

            rows.forEach(row => {
                // --- 攻擊隊資料處理 ---
                const apos1 = String(row['APos1'] || '-').trim();
                const apos2 = String(row['APos2'] || '-').trim();
                const apos3 = String(row['APos3'] || '-').trim();
                const apos4 = String(row['APos4'] || '-').trim();
                const asp1 = String(row['ASP1'] || '-').trim();
                const asp2 = String(row['ASP2'] || '-').trim();
                
                // SP 號位：無視順序，字典排序後結合 (例如: "伊呂波 + 泳葉")
                const sortedASP = [asp1, asp2].filter(name => name !== '-' && name !== '').sort().join(' + ') || '-';

                // --- 防禦隊資料處理 ---
                const dpos1 = String(row['DPos1'] || '-').trim();
                const dpos2 = String(row['DPos2'] || '-').trim();
                const dpos3 = String(row['DPos3'] || '-').trim();
                const dpos4 = String(row['DPos4'] || '-').trim();
                const dsp1 = String(row['DSP1'] || '-').trim();
                const dsp2 = String(row['DSP2'] || '-').trim();
                
                // SP 號位：無視順序，字典排序後結合
                const sortedDSP = [dsp1, dsp2].filter(name => name !== '-' && name !== '').sort().join(' + ') || '-';

                // --- 數據統計處理 ---
                const gamesCount = Number(row['總場次']) || 1;
                const winsCount = row['進攻勝場'] !== undefined ? Number(row['進攻勝場']) : 0;

                // 生成獨一無二的對局 Key (1~4 號位順序嚴格，SP 無視順序)
                const atkKey = `A:[${apos1},${apos2},${apos3},${apos4}]_ASP:[${sortedASP}]`;
                const defKey = `D:[${dpos1},${dpos2},${dpos3},${dpos4}]_DSP:[${sortedDSP}]`;
                const matchupKey = `${atkKey} VS ${defKey}`;

                if (!aggregatedMap.has(matchupKey)) {
                    aggregatedMap.set(matchupKey, {
                        apos1, apos2, apos3, apos4, asp: sortedASP,
                        dpos1, dpos2, dpos3, dpos4, dsp: sortedDSP,
                        totalGames: 0,
                        wins: 0
                    });
                }

                // 數據合流累加
                const matchupData = aggregatedMap.get(matchupKey);
                matchupData.totalGames += gamesCount;
                matchupData.wins += winsCount;
            });

            // 計算勝率並整理成列表
            currentData = Array.from(aggregatedMap.values()).map(item => {
                const winRate = item.totalGames > 0 
                    ? ((item.wins / item.totalGames) * 100).toFixed(1) 
                    : "0.0";
                return { ...item, winRate: parseFloat(winRate) };
            });

            document.getElementById('matchupCount').textContent = currentData.length;
            renderTable(currentData);
        }

        // 3. 渲染表格畫面
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="13" style="padding:30px;">📭 試算表中尚無資料。</td></tr>';
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${item.apos1}</b></td>
                    <td><b>${item.apos2}</b></td>
                    <td><b>${item.apos3}</b></td>
                    <td><b>${item.apos4}</b></td>
                    <td class="sp-cell">${item.asp}</td>
                    
                    <td><b>${item.dpos1}</b></td>
                    <td><b>${item.dpos2}</b></td>
                    <td><b>${item.dpos3}</b></td>
                    <td><b>${item.dpos4}</b></td>
                    <td class="sp-cell">${item.dsp}</td>
                    
                    <td>${item.totalGames}</td>
                    <td>${item.wins}</td>
                    <td class="win-rate">${item.winRate}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 4. 點擊欄位標題排序
        function sortTable(columnIndex) {
            const keys = [
                'apos1', 'apos2', 'apos3', 'apos4', 'asp',
                'dpos1', 'dpos2', 'dpos3', 'dpos4', 'dsp',
                'totalGames', 'wins', 'winRate'
            ];
            const key = keys[columnIndex];

            sortAscending = !sortAscending;

            currentData.sort((a, b) => {
                let valA = a[key];
                let valB = b[key];

                if (typeof valA === 'string') {
                    return sortAscending ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return sortAscending ? valA - valB : valB - valA;
                }
            });

            renderTable(currentData);
        }
    </script>
</body>
</html>
